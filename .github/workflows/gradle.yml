name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'

    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # The UI tests drive real browsers: install them, and the system libraries they need, at our Playwright version.
    - name: Install Playwright browsers
      run: ./gradlew :ui-test-automation:playwright --args="install --with-deps chromium firefox"

    # Builds and runs the tests of every module, the BOM included. Publishing is the release workflow's job.
    - name: Build and test
      run: ./gradlew build

  # The mobile module against a real emulator and Appium server, both in one container (mobile ADR-0003).
  mobile-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # Hosted Linux runners have KVM; the emulator needs it to be usable at all.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Start the emulator and Appium
      run: |
        docker run -d --name android --device /dev/kvm -p 4723:4723 \
          -e EMULATOR_DEVICE="Samsung Galaxy S10" -e APPIUM=true \
          budtmo/docker-android:emulator_14.0_v3.8.0-p1

    - name: Wait until the device has booted and Appium answers
      run: |
        timeout 900 bash -c 'until docker exec android adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 5; done'
        timeout 300 bash -c 'until curl -sf http://localhost:4723/status > /dev/null; do sleep 5; done'
        docker exec android adb devices

    - name: Integration tests
      run: ./gradlew :mobile-test-automation:integrationTest

    - name: Keep what explains a failure
      if: failure()
      run: docker logs android > docker-android.log 2>&1 || true

    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mobile-integration
        path: |
          mobile-test-automation/build/reports/tests/integrationTest
          mobile-test-automation/build/test-results/integrationTest
          docker-android.log
