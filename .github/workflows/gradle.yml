name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'

    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # The UI tests drive real browsers: install them, and the system libraries they need, at our Playwright version.
    - name: Install Playwright browsers
      run: ./gradlew :ui-test-automation:playwright --args="install --with-deps chromium firefox"

    # Builds and runs the tests; the modules are not published for now.
    - name: Build and test
      run: ./gradlew :http-test-automation:build :ui-test-automation:build :mobile-test-automation:build
