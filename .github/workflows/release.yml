name: Release

# Publishes every module, and the BOM, to GitHub Packages when a version tag is pushed (root ADR-0007).
on:
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # The tag is the version: v1.2.0 publishes 1.2.0, and only if gradle.properties says so.
    - name: Check the tag matches the version
      run: |
        version=$(./gradlew -q properties | sed -n 's/^version: //p')
        test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

    # The UI tests drive real browsers: install them at our Playwright version.
    - name: Install Playwright browsers
      run: ./gradlew :ui-test-automation:playwright --args="install --with-deps chromium firefox"

    - name: Build and publish
      run: ./gradlew build publish
      env:
        ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
        ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
