plugins {
    id 'qa.java-library'
    id 'qa.publishing'
}

description = 'Internal: reads the YAML config of the test automation modules. Comes in transitively; do not depend on it directly.'

dependencies {
    // Reads the YAML (1.2); no type of it is part of the API (root ADR-0006).
    implementation libs.snakeyaml.engine
    // Logs through SLF4J; the consumer's backend (Logback, Log4j) decides levels and where they go.
    implementation libs.slf4j.api
}
