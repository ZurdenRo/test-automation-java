# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
appium-java-client = "11.0.0"
commons-math3 = "3.6.1"
guava = "32.1.2-jre"
httpclient5 = "5.6.5"
jackson = "2.22.3"
junit-jupiter = "5.10.0"
logback = "1.5.38"
playwright = "1.64.0"
# Must match the selenium-api that appium-java-client brings (./gradlew :mobile-test-automation:dependencies).
selenium = "4.50.0"
slf4j = "2.0.20"
testng = "7.12.0"

[libraries]
appium-java-client = { module = "io.appium:java-client", version.ref = "appium-java-client" }
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commons-math3" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
selenium-support = { module = "org.seleniumhq.selenium:selenium-support", version.ref = "selenium" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
testng = { module = "org.testng:testng", version.ref = "testng" }
