plugins {
    id 'qa.java-library'
    id 'qa.publishing'
}

description = 'Library for talking to HTTP services from tests.'

dependencies {
    implementation libs.httpclient5
    implementation libs.jackson.databind
    // Logs through SLF4J; the consumer's backend (Logback, Log4j) decides levels and where they go.
    implementation libs.slf4j.api
    // Reads test-automation.yaml; none of its types is part of the API (root ADR-0006).
    implementation project(':config-loader')
}
