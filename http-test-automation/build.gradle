plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.company.qa'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.httpclient5
    implementation libs.jackson.databind
    // Logs through SLF4J; the consumer's backend (Logback, Log4j) decides levels and where they go.
    implementation libs.slf4j.api
    testImplementation libs.junit.jupiter
    testImplementation libs.logback.classic

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

publishing {

    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.company.qa'
            artifactId = 'http-test-automation'

            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
                url = "https://maven.pkg.github.com/ZurdenRo/test-automation-java"
            credentials {

                username = System.getenv("MY_USER")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
