plugins {
    id 'qa.java-library'
    id 'qa.publishing'
}

description = 'Library for driving mobile applications from tests, built on Appium.'

dependencies {
    // Public API: screens use Appium directly and wait with Selenium's ExpectedConditions (ADR-0002), and mobile
    // tests extend a TestNG class.
    api libs.appium.java.client
    api libs.selenium.support
    api libs.testng
    // Logs through SLF4J; the consumer's backend (Logback, Log4j) decides levels and where they go.
    implementation libs.slf4j.api
    // Reads test-automation.yaml; none of its types is part of the API (root ADR-0006).
    implementation project(':config-loader')
}

// Java 17, not 11 like the other modules (ADR-0005).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Tests against a real Appium server and device (ADR-0003): they reuse the unit tests' helpers, are not part of
// `build`, and need the server and an emulator up, as the mobile-integration CI job provides. Locally:
//   emulator -avd <avd> & appium &    ./gradlew :mobile-test-automation:integrationTest
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that need an Appium server and a device.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    // Always run: the result depends on the server and the device, which Gradle cannot see.
    outputs.upToDateWhen { false }
}
