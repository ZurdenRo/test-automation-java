plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.company.qa'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Public API: screens use Appium directly and wait with Selenium's ExpectedConditions (ADR-0002), and mobile
    // tests extend a TestNG class.
    api libs.appium.java.client
    api libs.selenium.support
    api libs.testng
    // Logs through SLF4J; the consumer's backend (Logback, Log4j) decides levels and where they go.
    implementation libs.slf4j.api
    testImplementation libs.junit.jupiter
    testImplementation libs.logback.classic

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Java 17, not 11 like the other modules (ADR-0005).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    // The module's own tests are JUnit; they run consumer-shaped TestNG classes programmatically.
    useJUnitPlatform()
}

// Tests against a real Appium server and device (ADR-0003): they reuse the unit tests' helpers, are not part of
// `build`, and need the server and an emulator up, as the mobile-integration CI job provides. Locally:
//   emulator -avd <avd> & appium &    ./gradlew :mobile-test-automation:integrationTest
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that need an Appium server and a device.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    // Always run: the result depends on the server and the device, which Gradle cannot see.
    outputs.upToDateWhen { false }
}

publishing {

    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.company.qa'
            artifactId = 'mobile-test-automation'

            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/ZurdenRo/test-automation-java"
            credentials {

                username = System.getenv("MY_USER")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
