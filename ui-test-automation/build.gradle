plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.company.qa'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Both are public API: page objects use Playwright directly (ADR-0001) and UI tests extend a TestNG class (ADR-0002).
    api libs.playwright
    api libs.testng
    // Logs through SLF4J; the consumer's backend (Logback, Log4j) decides levels and where they go.
    implementation libs.slf4j.api
    testImplementation libs.junit.jupiter
    testImplementation libs.logback.classic

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.named('test') {
    // The module's own tests are JUnit; they run consumer-shaped TestNG classes programmatically.
    useJUnitPlatform()
}

// Runs Playwright's CLI at the version this module depends on, e.g. in CI:
// ./gradlew :ui-test-automation:playwright --args="install --with-deps chromium firefox"
tasks.register('playwright', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
}

publishing {

    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.company.qa'
            artifactId = 'ui-test-automation'

            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
                url = "https://maven.pkg.github.com/ZurdenRo/test-automation-java"
            credentials {

                username = System.getenv("MY_USER")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
